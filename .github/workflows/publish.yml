name: Publish to npm

# 创建形如 v0.1.0（或 0.1.0）的 tag 时触发，校验版本号与 package.json 一致后发布到 npm。
# 通过 npm Trusted Publishing 使用 GitHub Actions OIDC；npm 包的 Trusted Publisher
# 配置应指定 xgone/dsh-remote 与本工作流文件名 publish.yml。

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      package_version:
        description: Published npm version to retag
        required: true
        type: string
      dist_tag:
        description: npm dist-tag to update
        required: true
        type: choice
        options:
          - latest
          - next

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @xgone/dsh-remote
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        if: github.event_name == 'push'
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: github.event_name == 'push'
        run: pnpm install --no-frozen-lockfile

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Publishing version: $PKG_VERSION"

      - name: Determine dist-tags
        if: github.event_name == 'push'
        id: dist-tag
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if printf '%s' "$PKG_VERSION" | grep -q -- "-"; then
            echo "publish_tag=next" >> "$GITHUB_OUTPUT"
            echo "sync_next=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish_tag=latest" >> "$GITHUB_OUTPUT"
            echo "sync_next=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm with Trusted Publishing
        if: github.event_name == 'push'
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.publish_tag }}"

      - name: Also point next at stable release
        if: github.event_name == 'push' && steps.dist-tag.outputs.sync_next == 'true'
        run: npm dist-tag add "@xgone/dsh-remote@${{ steps.dist-tag.outputs.version }}" next

      - name: Update an existing npm dist-tag with Trusted Publishing
        if: github.event_name == 'workflow_dispatch'
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          if [[ ! "$PACKAGE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid package version: $PACKAGE_VERSION"
            exit 1
          fi
          case "$DIST_TAG" in
            latest|next) ;;
            *) echo "::error::Unsupported dist-tag: $DIST_TAG"; exit 1 ;;
          esac
          npm dist-tag add "@xgone/dsh-remote@$PACKAGE_VERSION" "$DIST_TAG"
